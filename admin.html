<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mohsen Portfolio Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { font-family: 'SF Pro Display', 'Inter', sans-serif; background: #171c20; color: #dbf7ff; margin:0; height: 100%; }
    .glass-panel {
      background: rgba(20,30,41,0.63); border-radius: 18px; max-width: 680px; margin: 7vh auto 0; padding: 2.5rem 3.3rem;
      box-shadow: 0 6px 42px #18ebff15, 0 2.5px 32px #064d7a20; border:1.4px solid #33e9ff33;
      backdrop-filter: blur(24px);
      position:relative;
    }
    h1, h2 { color: #7af4fd; font-weight: 900; text-shadow:0 1px 24px #1affe544;}
    .locked input, .locked textarea, .locked select { pointer-events: none; background:#293d5588; color:#b2cadb;}
    .unlock-btn { background:linear-gradient(90deg,#51f3ee 10%,#153ff4 90%); color: #181a1f; border:none; font-weight:bold; border-radius:10px; font-size:1rem; padding:9px 19px; cursor:pointer; margin:1.8em 0 0;}
    .unlock-btn:hover {background:#181a1f; color:#42e3fa;}
    fieldset { border:1px solid #21e7fe33; border-radius:7px; background:#15233458; margin-bottom:1.5em;}
    legend { color:#05f4dc; font-weight:700; }
    label { display:block; margin:14px 0 6px; font-size:1.05em; }
    input[type="text"], textarea, select {
      width: 99%; background:#071823cc; color:#b2e7ff; border:1.4px solid #07bfe3;
      border-radius:7px; font-size:1.02em; padding:7px 13px; resize:vertical; margin-bottom:9px;
    }
    .stack-labels { display: flex; flex-wrap:wrap; gap:10px;}
    .stack-labels input { width:auto; min-width:99px;}
    .admin-btns { display: flex; gap: 12px; margin-top:15px;}
    .admin-btns button {
      background:linear-gradient(90deg,#1affe544,#51ebe1 55%); color: #061217; border:none; border-radius:6px;
      font-weight:bold; font-size:.98rem; padding:8px 18px; cursor:pointer;
      box-shadow:0 2px 7px #17e3ed44;
      transition:.14s cubic-bezier(.5,1,.5,1);
    }
    .admin-btns button:hover { background: #1d5a56; color: #46eaff; }
    .meta-row { display:flex; gap:19px;}
    @media(max-width:700px){.glass-panel{padding: 1.7rem 1.5rem;}}
  </style>
</head>
<body>
  <div class="glass-panel" id="panel">
    <h1>Portfolio Admin Panel</h1>
    <div id="lock-state">
      <div class="locked"><label>Password:</label><input type="password" id="adminPass" autocomplete="current-password"></div>
      <button class="unlock-btn" id="unlockBtn">Unlock</button>
      <p id="adminNotice" style="color:#fc96b3"></p>
    </div>
    <form id="adminForm" style="display:none;">
      <fieldset>
        <legend>Main Info</legend>
        <label>Hero / Welcome Title</label>
        <input type="text" id="heroTitle">
        <label>Hero / Welcome Caption</label>
        <textarea id="heroCaption" rows="2"></textarea>
      </fieldset>
      <fieldset>
        <legend>Projects <small style="color:#6fcdff">(Edit project cards below)</small></legend>
        <div id="projects"></div>
      </fieldset>
      <fieldset>
        <legend>Contact</legend>
        <label>Contact Email</label>
        <input type="text" id="contactEmail">
        <label>Contact Caption/Description</label>
        <textarea id="contactCaption" rows="2"></textarea>
      </fieldset>
      <div class="admin-btns">
        <button type="button" id="saveBtn">Save</button>
        <button type="button" id="exportBtn">Export JSON</button>
        <button type="button" id="importBtn">Import JSON</button>
        <button type="button" id="resetBtn">Reset Defaults</button>
      </div>
    </form>
  </div>
  <script type="module">
    // --- ADMIN LOGIC ---
    const PORTFOLIO_KEY = "mohsen_portfolio_v2";
    const adminPassword = "mohsen2026"; // change as you wish

    function getDefaultData() {
      return {
        main: {
          title: "Senior Developer <span style='color:#42f3e9'>Portfolio</span>",
          caption: "Welcome to Mohsen's cinematic timeline. Navigate through a world-class engineer's hacker studio."
        },
        projects: [
          {
            title: "Cinematic Fullstack DevLab",
            caption: "A personal dev environment with real-time LLM microservices, built for large-scale prototyping and rapid product delivery. Features automatic GPT agents, fine-tuned knowledge systems, and cyberpunk UI overlays inspired by movie OSes.",
            stack: ["Node.js", "Next.js", "Docker", "LLM Agents", "RedisEdge", "Vercel"],
            meta: "Repository: github.com/mahsen81/devlab • Build v2.1 • 2026-02 • LLM Kernel • AI Coding Agents",
            repo: "https://github.com/mahsen81/devlab"
          },
          {
            title: "Realtime Crypto Analytics",
            caption: "Blackbox backend for massive WebSocket crypto data, deep learning anomaly detectors, and streaming interactive dashboards with cinematic animations.",
            stack: ["TypeScript", "WebSocket", "PyTorch", "Three.js", "Vercel Edge"],
            meta: "Repository: github.com/mahsen81/crypto • Real-time Metrics • 2025-12 • Serverless Analytics",
            repo: "https://github.com/mahsen81/crypto"
          },
          {
            title: "Enterprise Chatops Platform",
            caption: "Senior architect on a cross-cloud platform for scalable chatbots, API routing, business automations, and developer UX tooling with cyberpunk luxury design.",
            stack: ["Python", "FastAPI", "Azure", "OpenAI", "WebRTC", "Linux"],
            meta: "Repository: github.com/mahsen81/chatops • Business Logic • 2025-10 • Cloud AI",
            repo: "https://github.com/mahsen81/chatops"
          },
          {
            title: "AAA Game Tools",
            caption: "Custom tools for game engine graph editors and advanced asset pipelines, featuring hacker lab interfaces and ultra-smooth motion transitions.",
            stack: ["C++", "ImGui", "Unity", "OpenGL", "CyberUI", "Houdini"],
            meta: "Private Repo • Build 1.9 • 2024-08 • Cyber Asset Pipeline",
            repo: "#"
          },
          {
            title: "Apple-Like Minimal Devops",
            caption: "Zero-downtime CI/CD orchestrator with premium UX for automated tests, status boards, and volumetric system health maps.",
            stack: ["Kubernetes", "Go", "React (custom)", "Electron", "Vercel", "Edge Functions"],
            meta: "Repository: github.com/mahsen81/devops-zero • 2024-11 • CI/CD Automation",
            repo: "https://github.com/mahsen81/devops-zero"
          }
        ],
        contact: {
          email: "contact@mahsen81.ir",
          caption: "Available for senior/lead/consulting opportunities • Based in Tehran • Open to global remote contracts • Currently: Principal Developer @ Freelance"
        }
      };
    }

    // --- Persistence ---
    function saveData(data) { localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(data)); }
    function loadData() {
      let d = localStorage.getItem(PORTFOLIO_KEY);
      try { return (d && JSON.parse(d)) || getDefaultData(); }
      catch { return getDefaultData(); }
    }
    function resetData() { saveData(getDefaultData()); }

    // --- View Generation ---
    function buildPanel(data) {
      // Main
      document.getElementById('heroTitle').value = data.main.title.replace(/<\/?span[^>]*>/g,"");
      document.getElementById('heroCaption').value = data.main.caption;

      // Projects
      const projCont = document.getElementById('projects');
      projCont.innerHTML = '';
      data.projects.forEach((p, i) => {
        let block = document.createElement('div');
        block.style="margin-bottom:2.3em;border:1px solid #18253377;padding:12px 15px 0;border-radius:4px;";
        block.innerHTML = `
          <label>Project ${i+1}: Title</label><input type="text" class="projTitle" value="${p.title}">
          <label>Description</label><textarea rows="2" class="projCaption">${p.caption}</textarea>
          <label>Stack Labels (comma separated)</label>
          <input type="text" class="projStack" value="${p.stack.join(', ')}">
          <label>Meta Line</label><input type="text" class="projMeta" value="${p.meta||""}">
          <label>Repository / Link</label><input type="text" class="projRepo" value="${p.repo||""}">`;
        projCont.appendChild(block);
      });

      // Contact
      document.getElementById('contactEmail').value = data.contact.email;
      document.getElementById('contactCaption').value = data.contact.caption;
    }

    function extractForm() {
      // Main
      let main = {
        title: document.getElementById('heroTitle').value,
        caption: document.getElementById('heroCaption').value
      };
      // Projects
      const projBlocks = Array.from(document.getElementById('projects').children);
      let projects = projBlocks.map(b => ({
        title: b.querySelector('.projTitle').value,
        caption: b.querySelector('.projCaption').value,
        stack: b.querySelector('.projStack').value.split(',').map(x=>x.trim()).filter(Boolean),
        meta: b.querySelector('.projMeta').value,
        repo: b.querySelector('.projRepo').value
      }));
      // Contact
      let contact = {
        email: document.getElementById('contactEmail').value,
        caption: document.getElementById('contactCaption').value
      };
      return {main, projects, contact};
    }

    // --- Unlock logic ---
    function setLockState(locked) {
      document.getElementById('lock-state').classList.toggle('locked', locked);
      document.getElementById('adminForm').style.display = locked ? "none" : "";
      Array.from(document.querySelectorAll('#adminForm input, #adminForm textarea')).forEach(e=>{
        e.disabled = locked;
      });
      document.getElementById('unlockBtn').disabled = !locked;
    }

    // --- Button callbacks ---
    document.getElementById('unlockBtn').onclick = () => {
      const pass = document.getElementById('adminPass').value.trim();
      if (pass === adminPassword) {
        setLockState(false);
        document.getElementById('adminNotice').innerText = "";
        buildPanel(loadData());
      } else {
        document.getElementById('adminNotice').innerText = "Invalid password.";
      }
    };

    document.getElementById('saveBtn').onclick = () => {
      saveData(extractForm());
      alert('Saved!');
    };
    document.getElementById('exportBtn').onclick = () => {
      let d = JSON.stringify(extractForm(),null,2);
      let blob = new Blob([d], {type:'application/json'});
      let link = document.createElement('a');
      link.href=URL.createObjectURL(blob); link.download="portfolio-export.json";
      document.body.appendChild(link); link.click(); setTimeout(()=>link.remove(),150);
    };
    document.getElementById('importBtn').onclick = () => {
      let inp = document.createElement('input');
      inp.type = 'file'; inp.accept =  ".json,application/json";
      inp.onchange = e => {
        let file = inp.files[0]; if (!file) return;
        let reader = new FileReader();
        reader.onload = function(evt) {
          try{
            let data = JSON.parse(evt.target.result);
            saveData(data);
            buildPanel(data);
            alert('Import OK');
          }catch{ alert('Invalid JSON.')}
        };
        reader.readAsText(file);
      };
      inp.click();
    };
    document.getElementById('resetBtn').onclick = () => {
      resetData();
      buildPanel(loadData());
      alert('Defaults restored.');
    };

    // Initialize as locked
    setLockState(true);

    // If data exists, build form (not editable until unlocked)
    buildPanel(loadData());
  </script>
</body>
</html>
