<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mohsen | Senior Developer Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #0a0d12;
      font-family: 'SF Pro Display', 'Inter', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
      color: #e2e8f0;
    }
    #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; outline: none; }
    #loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #090c10ee; display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 99; backdrop-filter: blur(22px);
      transition: opacity .7s cubic-bezier(.5,1,.5,1);
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-pulse {
      width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, #71c7ec55, transparent 70%);
      animation: loader-pulse 1.2s infinite alternate cubic-bezier(.75,.1,.4,.9);
      margin-bottom: 16px; filter: blur(1.5px);
    }
    @keyframes loader-pulse { 100% { transform: scale(1.13) rotate(8deg); opacity: .52;} }

    .loader-progress {
      font-size: 1.07rem; letter-spacing: 0.15em; color: #fff; opacity: .87; font-family: monospace;
      text-shadow: 0 4px 24px #1a2638, 0 1px 1px #1f2942;
      transition: .25s;
    }

    /* Overlay */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
      z-index: 2;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: opacity 1s cubic-bezier(.84,0,.2,1);
      opacity: 0;
    }
    #overlay.on { opacity: 1; pointer-events: none;  }

    .section-ui {
      position: absolute; left: 0; width: 100vw; min-height: 100vh; padding: 10vh 8vw 6vh 8vw;
      display: flex; flex-direction: column; align-items: flex-start;
      z-index: 3; pointer-events: none;
      will-change: opacity,transform;
      opacity: 0;
    }
    .section-ui.active { opacity: 1; transition: opacity 0.85s; }
    .ghost-number {
      position: absolute; top: 8vh; right: 5vw; font-size: calc(16vw + 32px); font-weight: 800;
      color: #fff; opacity: 0.045; z-index: 2; letter-spacing: -0.1em; user-select:none;
      pointer-events: none; transform: translateY(0); transition: transform 1s cubic-bezier(.5,1,0,1);
      font-family: 'SF Pro Display','Segoe UI','Roboto','Arial',sans-serif;
      text-shadow: 0 1px 22px #42eafa11, 0 1px 15px #2a4a74;
      filter: blur(2px);
    }
    .section-title-row {
      display: flex; align-items: flex-end; gap: 1.5rem; font-size: 3.2rem; font-weight: 700;
      margin-bottom: 1.2rem;
    }
    .vertical-divider {
      width: 1px; height: 2.2rem; background: linear-gradient(180deg,#54e1ff55 0%,#2d323766 100%);
      margin: 0 .9rem;
      border-radius: 2px;
      opacity:.32;
    }
    .section-caption {
      font-size: 1.38rem; font-weight: 400; color: #b9d6fa; letter-spacing: .05em;
      max-width: min(48vw,480px); margin: 1rem 0 0;
      filter: brightness(.94);
      text-shadow: 0 2px 12px #02214a22;
      line-height: 1.55;
    }
    .project-stack-labels {
      display: flex; gap: .8rem; margin-top: 1.2rem;
    }
    .stack-label {
      display: inline-block; background: linear-gradient(90deg,#71c7ec18,#2be1ff44 90%); color: #e6faff;
      font-size: 1.01rem; letter-spacing:.06em; font-weight: 500; padding: 0.18em 1.1em; border-radius: 22px;
      box-shadow: 0 1.5px 10px #15aabd33;
      border: 1px solid #19405538;
      opacity: .82; transition: background .34s, box-shadow .4s;
      cursor: pointer;
      position: relative; z-index: 2;
      will-change: filter, box-shadow, background;
      pointer-events:auto;
    }
    .stack-label.active {
      background: linear-gradient(90deg,#18c7ff 50%,#1ba6fc66 97%);
      color: #1a3d4d; font-weight: 700; opacity: 1;
      box-shadow: 0 4px 32px #0afddb33;
    }
    .meta-line {
      font-size: .97rem; color: #8dd8e4; opacity: .72; margin-top: 0.95rem;
      font-family: "JetBrains Mono", monospace; user-select: text;
      letter-spacing: .055em; font-weight: 500; line-height: 1.4;
    }
    .animated-accent, .active-line {
      height: 3.2px; border-radius: 3px; width: 38px;
      background: linear-gradient(90deg,#2afeb1 13%, #58dafe 79%);
      margin-top: -10px; margin-bottom: 1.19em;
      transition: all .55s cubic-bezier(.5,1,.7,1.1);
      box-shadow: 0 1.5px 10px #15aabd44;
      filter: blur(.5px);
    }
    /* UI Aesthetics */
    @media(max-width:940px) { .ghost-number { font-size: 22vw; } .section-ui {padding:4vw 4vw 6vw 4vw;} .section-title-row{font-size:2.2rem;} }
    @media(max-width:560px) { .ghost-number { font-size: 33vw; } .section-ui {padding:2vw 2vw 2vw 2vw;} .section-title-row{font-size:1.42rem;} .section-caption{font-size:.99rem;} .meta-line{font-size:.86rem;} }

    /* Audio Player */
    #audio-panel {
      position: fixed; bottom: 2.6vh; right: 2vw;
      background: rgba(20,32,40,0.67);
      border-radius: 18px; backdrop-filter: blur(10px);
      padding: 1.2em 2.0em 1.2em 1.6em; box-shadow: 0 8px 40px #0fdeee18;
      display: flex; align-items: center; z-index: 44;
      border: 1.5px solid rgba(41,81,110,.29);
      gap: 1.5em; min-width: 220px; min-height: 54px;
      font-family: JetBrains Mono, monospace;
      transition: opacity .5s cubic-bezier(.5,1,.3,.82);
      opacity:.98;
      user-select: none;
    }
    #audio-panel .waveform {
      width: 36px; height: 28px; display: flex; align-items: flex-end; gap: 2.5px;
      margin-left: 12px;
    }
    .wave-bar {
      width: 3px; background: linear-gradient(160deg,#14f1c9 60%,#42e3fd 99%);
      border-radius: 2px; transition: height .22s cubic-bezier(.8,.1,.4,.9);
      opacity: .77; margin-bottom: 2.5px;
    }
    #audio-panel .track-label { font-size: 1.01em; font-weight: 500; color: #bee9f5; margin-right: 1.13em;}
    #audio-panel .scene-indicator {
      font-size: .85em; color: #52f0cfdd; opacity: .56; font-weight:700; letter-spacing:.08em;
      margin-left: 10px;
    }
    #audio-panel button {
      background: none; border: none; outline: none; font-size: 1.1em; color: #45eaff;
      cursor: pointer; padding: .47em .84em;
      border-radius: 7px; transition: background .16s;
      margin-right: 6px;
    }
    #audio-panel button:hover { background:rgba(22,120,148,0.11);}
    #audio-panel .mute-btn { color: #e16ce8; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.min.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas" tabindex="1"></canvas>

  <div id="loader">
    <div class="loader-pulse"></div>
    <div class="loader-progress">Loading <span id="progressNum">0</span>%</div>
  </div>

  <div id="overlay"></div>

  <div id="audio-panel" style="display:none;">
    <button id="audio-play">&#9658;</button>
    <button id="audio-mute" class="mute-btn">&#128264;</button>
    <span class="track-label"></span>
    <div class="waveform"></div>
    <span class="scene-indicator"></span>
  </div>

  <script type="module">
    // --- Portfolio Content: Inspired by https://mahsen81.ir, editable from admin.html ---
    let portfolio = [
      {
        title: "Cinematic Fullstack DevLab",
        caption: "A personal dev environment with real-time LLM microservices, built for large-scale prototyping and rapid product delivery. Features automatic GPT agents, fine-tuned knowledge systems, and cyberpunk UI overlays inspired by movie OSes.",
        stack: ["Node.js", "Next.js", "Docker", "LLM Agents", "RedisEdge", "Vercel"],
        meta: "Repository: github.com/mahsen81/devlab • Build v2.1 • 2026-02 • LLM Kernel • AI Coding Agents",
        repo: "https://github.com/mahsen81/devlab"
      },
      {
        title: "Realtime Crypto Analytics",
        caption: "Blackbox backend for massive WebSocket crypto data, deep learning anomaly detectors, and streaming interactive dashboards with cinematic animations.",
        stack: ["TypeScript", "WebSocket", "PyTorch", "Three.js", "Vercel Edge"],
        meta: "Repository: github.com/mahsen81/crypto • Real-time Metrics • 2025-12 • Serverless Analytics",
        repo: "https://github.com/mahsen81/crypto"
      },
      {
        title: "Enterprise Chatops Platform",
        caption: "Senior architect on a cross-cloud platform for scalable chatbots, API routing, business automations, and developer UX tooling with cyberpunk luxury design.",
        stack: ["Python", "FastAPI", "Azure", "OpenAI", "WebRTC", "Linux"],
        meta: "Repository: github.com/mahsen81/chatops • Business Logic • 2025-10 • Cloud AI",
        repo: "https://github.com/mahsen81/chatops"
      },
      {
        title: "AAA Game Tools",
        caption: "Custom tools for game engine graph editors and advanced asset pipelines, featuring hacker lab interfaces and ultra-smooth motion transitions.",
        stack: ["C++", "ImGui", "Unity", "OpenGL", "CyberUI", "Houdini"],
        meta: "Private Repo • Build 1.9 • 2024-08 • Cyber Asset Pipeline",
        repo: "#"
      },
      {
        title: "Apple-Like Minimal Devops",
        caption: "Zero-downtime CI/CD orchestrator with premium UX for automated tests, status boards, and volumetric system health maps.",
        stack: ["Kubernetes", "Go", "React (custom)", "Electron", "Vercel", "Edge Functions"],
        meta: "Repository: github.com/mahsen81/devops-zero • 2024-11 • CI/CD Automation",
        repo: "https://github.com/mahsen81/devops-zero"
      }
    ];
    // --- Overlay UI Elements ---
    const overlay = document.getElementById('overlay');
    // UI scenes: intro, 5 projects, contact
    const uiSections = [
      {
        ghost: "",
        title: "Senior Developer <span style='color:#42f3e9'>Portfolio</span>",
        caption: "Welcome to Mohsen's cinematic timeline. Navigate through a world-class engineer's hacker studio.",
        meta: "",
        stack: [],
        repo: ""
      },
      ...portfolio.map((p,i) => ({
        ghost: `0${i+1}`,
        title: p.title,
        caption: p.caption,
        stack: p.stack,
        meta: p.meta,
        repo: p.repo
      })),
      {
        ghost: "",
        title: "Contact & Links",
        caption: `<a href="mailto:contact@mahsen81.ir" target="_blank" style="color:#52d2e2;text-decoration:underline">contact@mahsen81.ir</a><br>
        <a href="https://github.com/mahsen81" target="_blank" style="color:#39eef0">GitHub</a> &nbsp;&middot;&nbsp;
        <a href="https://dev.to/mahsen81" target="_blank" style="color:#47e8e7">Dev.to</a>`,
        meta: "Available for senior/lead/consulting opportunities • Based in Tehran • Open to global remote contracts • Currently: Principal Developer @ Freelance",
        stack: [],
        repo: ""
      }
    ];

    // --- HTML Overlay UI Creation ---
    const makeSections = () => {
      overlay.innerHTML = ""; // Clear
      uiSections.forEach((sec, idx) => {
        const div = document.createElement('div');
        div.className = 'section-ui';
        div.style.top = "0"; // will control y per scroll
        div.setAttribute("data-section", idx);

        // Ghost number (project only)
        if (sec.ghost) {
          const ghost = document.createElement('div');
          ghost.className = 'ghost-number';
          ghost.innerText = sec.ghost;
          div.appendChild(ghost);
        }
        // Main title / caption
        const row = document.createElement('div');
        row.className = 'section-title-row';
        row.innerHTML = `<span>${sec.title}</span>` +
          (sec.caption ? '<span class="vertical-divider"></span><span class="section-caption">'+sec.caption+'</span>' : '');
        div.appendChild(row);

        // Stack labels
        if (sec.stack && sec.stack.length) {
          const stackWrap = document.createElement('div');
          stackWrap.className = 'project-stack-labels';
          sec.stack.forEach((lbl, i) => {
            let stackLabel = document.createElement('span');
            stackLabel.className = 'stack-label';
            stackLabel.innerText = lbl;
            if (i === 0) stackLabel.classList.add('active');
            stackWrap.appendChild(stackLabel);
          });
          div.appendChild(stackWrap);
          let accent = document.createElement('div');
          accent.className = 'animated-accent';
          stackWrap.appendChild(accent);
        }
        // Meta info
        if (sec.meta) {
          let meta = document.createElement('div');
          meta.className = 'meta-line';
          meta.innerHTML = sec.meta;
          div.appendChild(meta);
        }
        overlay.appendChild(div);
      });
      // Add overlay fade-in
      setTimeout(() => overlay.classList.add('on'), 250);
    };
    makeSections();

    // --- SCROLL/CAMERA SYSTEM ---
    let sectionCount = uiSections.length;
    let scroll = 0, scrollTarget = 0, lastY = 0, scrollDir = "down";
    let sectionHeight = 1; // normalized per scene
    let activeSection = 0;

    const setActiveSection = idx => {
      [...overlay.children].forEach((c, i) => {
        c.style.opacity = i === idx ? "1" : "0";
        c.classList.toggle('active', i === idx);
        if (c.querySelector('.ghost-number')) {
          c.querySelector('.ghost-number').style.transform = `translateY(${-(scroll*48)%32}px)`;
        }
      });
      activeSection = idx;
    };

    window.addEventListener('resize', () => { sectionHeight = 1; });

    // UI reveals
    setActiveSection(0);

    // --- LOADER & ASSET SYSTEM ---
    const loader = document.getElementById('loader');
    const progressNum = document.getElementById('progressNum');
    let assets = {
      hero: "hero.webp",
      images: ["1.png", "2.png", "3.png", "4.png", "5.png"]
    };

    async function preloadImage(src) {
      return new Promise((res,rej) => {
        const img = new Image();
        img.src = src;
        img.onload = () => res(img);
        img.onerror = rej;
      });
    }

    // Critical path: Load hero.webp
    let progress = 0;
    function updateProgress(val) {
      progress = Math.min(99, val);
      progressNum.textContent = Math.floor(progress);
    }

    // Show loader first
    updateProgress(6);

    // --- THREE.JS + EFFECT SYSTEM ---
    import { PerspectiveCamera, Scene, WebGLRenderer, Vector3, Color, TextureLoader, Mesh, PlaneGeometry, MeshBasicMaterial, Fog, sRGBEncoding, LinearSRGBColorSpace } from "three";
    import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/examples/jsm/postprocessing/ShaderPass.js";
    import { VignetteShader } from "three/examples/jsm/shaders/VignetteShader.js";

    // --- STATE ---
    let canvas = document.getElementById('webgl-canvas');
    let scene, camera, renderer, composer;
    let planes = []; // project planes
    let heroPlane = null;
    let imageTextures = [];
    let zSpacing = 5.6;  // space between project planes along z axis
    let cameraTarget = new Vector3(0, 0, 0);
    let yLerp = 0;
    let zLerp = 0, camZBase = 10;

    async function boot() {
      // ---- Loader step 1: Preload hero
      updateProgress(10);
      const heroTex = await preloadImage(assets.hero);
      updateProgress(28);

      // --- Init Three.js ---
      renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setClearColor(0x101418, 1);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = LinearSRGBColorSpace;
      renderer.toneMappingExposure = 1.09;

      scene = new Scene();
      scene.background = new Color(0x0d1117);
      scene.fog = new Fog(0x0f1621, 19, 46);

      camera = new PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.13, 555);
      camera.position.set(0, 0, camZBase);

      // --- Post Processing ---
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      // bloom
      composer.addPass(new UnrealBloomPass(new Vector3(1.6,1.6,1.6), 0.54, 0.96, 0.32));
      // vignette
      let vignette = new ShaderPass(VignetteShader);
      vignette.uniforms["offset"].value = 1.423;
      vignette.uniforms["darkness"].value = 1.47;
      composer.addPass(vignette);

      // --- Planes ---
      let planeGeo = new PlaneGeometry(7.2, 3.65, 18, 10);
      // hero plane
      let heroMat = new MeshBasicMaterial({ map: new TextureLoader().load(assets.hero), depthWrite:false, fog:!0 });
      heroPlane = new Mesh(planeGeo, heroMat);
      heroPlane.position.set(0, 0, 0);
      heroPlane.material.transparent = true;
      scene.add(heroPlane);
      updateProgress(39);

      // Async: begin loading project images in background; don't block.
      let texLoader = new TextureLoader();
      let imgPromises = assets.images.map((img, i) => new Promise(resolve => {
        texLoader.load(img, tex => {
          imageTextures[i] = tex;
          resolve();
          updateProgress(44 + i*9);
        });
      }));

      // project planes
      for (let i = 0; i < assets.images.length; i++) {
        let mat = new MeshBasicMaterial({ color:0x131d26, map:null, transparent:true, opacity:.93 });
        let m = new Mesh(planeGeo.clone(), mat);
        // Z: staggered along timeline, some Y jitter
        m.position.set((i%2===0?0.53:-0.5)*(Math.random()*0.20+1.0), (i-2)*0.45, (i+1)*zSpacing);
        m.castShadow = false;
        m.material.depthWrite = false;
        m.userData = { idx: i, hovered: false };
        scene.add(m);
        planes.push(m);
      }
      updateProgress(78);

      // --- Responsive ---
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });

      // --- Remove loader on hero.webp finish ---
      setTimeout(() => { loader.classList.add('hidden'); overlay.classList.add('on'); }, 330);

      // --- assign images to planes (async) ---
      Promise.allSettled(imgPromises).then(() => {
        for (let i = 0; i < imageTextures.length; i++) {
          if (planes[i] && imageTextures[i]) {
            planes[i].material.map = imageTextures[i];
            planes[i].material.needsUpdate = true;
          }
        }
        updateProgress(99);
        setTimeout(() => loader.remove(), 800);
      });

      // Animate
      animate();
    }

    // --- RAF LOOP & INTERACTION ---
    function animate(time) {
      // -- Scroll input mapped to camera z
      let maxScene = sectionCount-1;
      let scrollY = window.scrollY || 0;
      let docH = document.body.offsetHeight;
      let viewH = window.innerHeight;
      let normScroll = Math.max(0, Math.min(1, scrollY / (docH - viewH - 3)));
      let targetSection = Math.round(normScroll * maxScene);
      // Clamp scroll Z between start (hero) and end (contact)
      let zTarget = camZBase + zSpacing * normScroll * (assets.images.length + 1.2);
      camera.position.z = zLerp = lerp(camera.position.z, zTarget, 0.13);

      // Subtle y-axis parallax
      let yTarget = Math.sin(time * 0.00043) * 0.16 + (targetSection-2.0)*0.1 ;
      camera.position.y = yLerp = lerp(camera.position.y, yTarget, 0.074);

      // Focus on center
      camera.lookAt(0,0,0);

      // Planes: float, shader parallax, hover
      for (let i = 0; i < planes.length; i++) {
        let plane = planes[i];
        let baseZ = (i+1)*zSpacing;
        let float = Math.sin(time*0.00048+i*0.27)*0.21 + (plane.userData.hovered?0.07:0.0);
        plane.position.y = float+(i-2)*0.42;
        // Animate opacity based on camera z distance
        let zDist = Math.abs(camera.position.z - baseZ);
        plane.material.opacity = Math.max(0.21, 1.18 - zDist*0.27);
        if (plane.material.map) plane.material.needsUpdate = true;
        // Glow on hover
        plane.material.emissive = plane.userData.hovered? new Color("#33e5ff"): new Color(0x0);
      }
      // Hero plane fade when scrolling to scene 1
      heroPlane.material.opacity = Math.max(.07, 0.99 - ((camera.position.z-camZBase)/5.7));
      // setActiveSection: update UI overlay visibility
      let visSection = Math.min(maxScene, Math.max(0, Math.round((camera.position.z-camZBase) / zSpacing)));
      setActiveSection(visSection);

      // Overlay: parallax ghost numbers (move slower than UI)
      let currUI = overlay.children[visSection] || overlay.firstChild;
      if (currUI && currUI.querySelector('.ghost-number')) {
        currUI.querySelector('.ghost-number').style.transform =
          `translateY(${Math.sin(performance.now()*0.00011+visSection*2.3)*13}px)`;
      }

      composer.render();

      requestAnimationFrame(animate);
    }

    // --- SCROLL SYSTEM (inertia, touch, wheel) ---
    let scrollLock = false;
    let desiredSection = 0;
    let scrollStep = () => {
      if (!scrollLock) {
        let scrollMax = document.body.scrollHeight-window.innerHeight;
        let newTarget = Math.max(0, Math.min(sectionCount-1, Math.round(scrollTarget)));
        window.scrollTo({ top: scrollMax * (newTarget/(sectionCount-1)), behavior:'smooth'});
      }
    };
    window.addEventListener('wheel',(e)=>{
      if (Math.abs(e.deltaY) > 7) {
        desiredSection += e.deltaY > 0 ? 1 : -1;
        desiredSection = Math.max(0, Math.min(sectionCount-1, desiredSection));
        scrollTarget = desiredSection;
        scrollStep();
      }
    }, {passive:true});
    window.addEventListener('keydown', (e) => {
      if (e.key=='ArrowDown' || e.key == 'PageDown') { desiredSection++; scrollTarget = desiredSection; scrollStep(); }
      if (e.key=='ArrowUp' || e.key == 'PageUp')   { desiredSection--; scrollTarget = desiredSection; scrollStep(); }
      desiredSection = Math.max(0, Math.min(sectionCount-1, desiredSection));
    });

    // --- HOVER MICRO-INTERACTION ---
    canvas.addEventListener('pointermove', (e) => {
      // Raycast for plane hover (simplified hitbox)
      let mx = e.offsetX / canvas.width * 2 - 1;
      let my = - (e.offsetY / canvas.height * 2 - 1);
      for (let i = 0; i < planes.length; i++) {
        let p = planes[i];
        // Approximate hit
        let screenZ = (p.position.z-camZBase-(camera.position.z-camZBase));
        if (Math.abs(screenZ)<2.45) {
          p.userData.hovered = true;
          canvas.style.cursor = 'pointer';
        } else {
          p.userData.hovered = false;
        }
      }
    });
    canvas.addEventListener('pointerout', ()=>{
      planes.forEach(p=>p.userData.hovered=false);
      canvas.style.cursor='';
    });

    // --- AUDIO AMBIENT SYSTEM ---
    const audioPanel = document.getElementById('audio-panel');
    const playBtn = document.getElementById('audio-play');
    const muteBtn = document.getElementById('audio-mute');
    const trackLabel = audioPanel.querySelector('.track-label');
    const sceneInd = audioPanel.querySelector('.scene-indicator');
    // List of ambient audio per scene (small synth tracks, in same folder, could use local .mp3/.ogg)
    // Actual audio files must exist beside index.html for full effect (user should provide .mp3/ogg/wav with matching filename):
    let audioAssets = [
      { src: "ambient-hero.mp3", label: "Lab Entrance"},
      { src: "ambient-1.mp3",    label: "Neural Cluster"},
      { src: "ambient-2.mp3",    label: "Crypto Blackbox"},
      { src: "ambient-3.mp3",    label: "Cloud Chatops"},
      { src: "ambient-4.mp3",    label: "Game Tools"},
      { src: "ambient-5.mp3",    label: "DevOps Arena"},
      { src: "ambient-contact.mp3", label: "Contact Sphere"}
    ];
    let audios = [], isPlaying = false, isMuted = false, currAudio = 0;
    function loadAudios() {
      let loaded = 0;
      audioAssets.forEach((a, i) => {
        let aud = new Audio(a.src);
        aud.loop = true;
        aud.autoplay = false;
        aud.preload = 'auto';
        aud.volume = i === 0 ? 1.0 : 0;
        audios[i] = aud;
        aud.addEventListener('canplaythrough', ()=>{ if(++loaded===audioAssets.length){}});
      });
    }
    // Gain crossfade: fade in new, fade out old
    function crossfade(toIdx) {
      for (let i=0;i<audios.length;i++) {
        let a=audios[i];
        let targetVolume = (i===toIdx)?1:0;
        let diff = Math.abs(a.volume-targetVolume);
        if (diff<0.01) continue;
        let fade = setInterval(()=>{
          if (a.volume<targetVolume) a.volume = Math.min(1,a.volume+0.06);
          else if (a.volume>targetVolume) a.volume = Math.max(0,a.volume-0.06);
          else clearInterval(fade);
        },38);
      }
    }
    // When section changes, fade to new ambient
    function updateAudioSection(idx) {
      sceneInd.innerHTML = `Scene <b>0${idx+1}</b>`;
      trackLabel.textContent = audioAssets[idx]?.label??"";
      if (audios.length && idx!==currAudio) {
        crossfade(idx);
        currAudio = idx;
      }
    }
    // Waveform: fake animation bars
    function updateWave() {
      const wave = audioPanel.querySelector('.waveform');
      if (!wave.childNodes.length) {
        for (let i=0;i<5;i++) {
          let bar = document.createElement('div');
          bar.className = 'wave-bar';
          bar.style.height = (8+Math.random()*14)+'px';
          wave.appendChild(bar);
        }
      }
      // Animate
      setInterval(()=> {
        if(isPlaying && !isMuted) {
          [...wave.children].forEach((bar, i) => {
            bar.style.height = (6+Math.random()*14+4*Math.sin(Date.now()*0.0021+i)).toFixed(1)+"px";
          });
        }
      }, 140);
    }
    audioPanel.style.display = "flex";
    updateWave();

    // Control Play/Mute
    playBtn.onclick=()=>{
      if(isPlaying) { audios.forEach(a=>a.pause()); playBtn.innerHTML="&#9658;"; isPlaying=false;}
      else { audios.forEach((a,i)=> { if(i===currAudio)a.play(); }); playBtn.innerHTML="&#10073;&#10073;"; isPlaying=true;}
    };
    muteBtn.onclick=()=>{
      isMuted=!isMuted; audios.forEach(a=>a.muted=isMuted); muteBtn.innerHTML=isMuted?"&#128263;":"&#128264;";
    };

    // Unlock autoplay: wait for first user gesture!
    let unlocked = false;
    function unlockAudioContext() {
      if(unlocked)return;
      setTimeout(()=>{
        loadAudios();
        isPlaying=true; audios[0]?.play();
        playBtn.innerHTML="&#10073;&#10073;";
        unlocked=true;
      },80);
    }
    ['wheel','click','keydown','touchstart'].forEach(ev=>{
      window.addEventListener(ev, unlockAudioContext, { once:true });
    });

    // Section-driven update
    function onOverlayActive(idx) {
      updateAudioSection(idx);
      // update active UI accents
      let ui = overlay.children[idx];
      if(!ui)return;
      let stacks = ui.querySelectorAll('.stack-label');
      let accent = ui.querySelector('.animated-accent');
      if (stacks && accent) {
        stacks.forEach((lbl,j) => lbl.onclick=()=> {
          stacks.forEach(x=>x.classList.remove('active'));
          lbl.classList.add('active');
          accent.style.transform = `translateX(${lbl.offsetLeft-4}px)`;
        });
        accent.style.transform = `translateX(0)`;
      }
    }
    overlay.addEventListener('transitionend', () => onOverlayActive(activeSection));

    // Listen for section changes (in animate)
    let lastSectionIdx = 0;
    setInterval(()=>{
      if (activeSection!==lastSectionIdx) {
        onOverlayActive(activeSection);
        lastSectionIdx = activeSection;
      }
    },140);

    // --- UTILITIES ---
    function lerp(a,b,t){return a+(b-a)*t;}

    // -- START!
    boot();
  </script>
</body>
</html>
